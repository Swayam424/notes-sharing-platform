<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A premium academic notes sharing platform. Discover, share, and organize lecture notes, past papers, and study materials across your college departments." />
    <title>Atelier — Notes that match your syllabus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#F4F4F2" />
    <style>
      body { margin: 0; background: #F4F4F2; }
      #root-fallback { min-height: 100vh; display: grid; place-items: center; }
      #root-fallback span { width: 120px; height: 2px; background: #E3E3E0; overflow: hidden; position: relative; }
      #root-fallback span::after { content: ""; position: absolute; inset: 0; width: 40%; background: #121214; animation: boot 1s cubic-bezier(.22,1,.36,1) infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #root-fallback span::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-fallback" role="status" aria-label="Loading Atelier"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
